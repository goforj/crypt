name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, race, and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Verify tidy modules
        run: |
          go mod tidy
          (cd examples && go mod tidy)
          git diff --exit-code -- go.mod go.sum examples/go.mod examples/go.sum
          test -z "$(git status --porcelain --untracked-files=all -- go.mod go.sum examples/go.mod examples/go.sum)"

      - name: Verify generated documentation
        run: |
          go run ./docs/examplegen/main.go
          go run ./docs/readme/main.go
          git diff --exit-code -- README.md examples
          test -z "$(git status --porcelain --untracked-files=all -- README.md examples)"

      - name: Vet root and examples
        run: |
          go vet ./...
          (cd examples && go vet ./...)

      - name: Test root with race and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Test generated examples with race
        working-directory: examples
        run: go test -race ./...

      - name: Upload coverage
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Go ${{ matrix.go-version }} / ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.4", stable]
        goarch: [amd64, "386"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet root and examples
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          (cd examples && go vet ./...)

      - name: Test root and examples
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
        run: |
          go test ./...
          (cd examples && go test ./...)
