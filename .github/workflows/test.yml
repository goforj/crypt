name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality, race, and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up stable Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Verify tidy modules
        run: |
          go mod tidy
          (cd examples && go mod tidy)
          git diff --exit-code -- go.mod go.sum examples/go.mod examples/go.sum
          test -z "$(git status --porcelain --untracked-files=all -- go.mod go.sum examples/go.mod examples/go.sum)"

      - name: Verify generated documentation
        run: |
          go run ./docs/examplegen/main.go
          go run ./docs/readme/main.go
          git diff --exit-code -- README.md examples
          test -z "$(git status --porcelain --untracked-files=all -- README.md examples)"

      - name: Vet root and examples
        run: |
          go vet ./...
          (cd examples && go vet ./...)

      - name: Test root with race and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Test generated examples with race
        working-directory: examples
        run: go test -race ./...

      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  compatibility:
    name: Go ${{ matrix.go-version }} / ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.4", stable]
        goarch: [amd64, "386"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet root and examples
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          (cd examples && go vet ./...)

      - name: Test root and examples
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.goarch }}
        run: |
          go test ./...
          (cd examples && go test ./...)
